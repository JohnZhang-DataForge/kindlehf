name: KindleHF build and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kindlehf:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl zstd file binutils zip python3 pkg-config libgtk2.0-dev xvfb libarchive-dev libssl-dev liblzma-dev libtool-bin nettle-dev

      - name: Host-side NES core and controller tests
        run: |
          mkdir -p build/host vendor
          gcc -std=gnu11 -O2 -Wall -Wextra -Wno-deprecated-declarations \
            -Isrc $(pkg-config --cflags gtk+-2.0) \
            -c src/file_picker.c -o build/host/file_picker.o
          gcc -std=gnu11 -O2 -Wall -Wextra -Wno-deprecated-declarations \
            -Isrc $(pkg-config --cflags gtk+-2.0) \
            src/file_picker.c tests/test_file_picker.c \
            $(pkg-config --libs gtk+-2.0) -lm -o build/host/test_file_picker
          xvfb-run -a build/host/test_file_picker
          git clone https://github.com/xboot/libxnes vendor/libxnes
          git -C vendor/libxnes checkout --detach 45cab8022732542d0a8c6eddd4fb26c393744afe
          python3 tests/make_mapper0_rom.py build/host/homebrew-mapper0.nes
          mapfile -t XNES_SOURCES < <(find vendor/libxnes/src -type f -name '*.c' -print | sort)
          gcc -std=gnu11 -O2 -Wall -Wextra \
            -Ivendor/libxnes/src tests/test_core.c "${XNES_SOURCES[@]}" \
            -lm -o build/host/test_core
          build/host/test_core build/host/homebrew-mapper0.nes
          gcc -std=gnu11 -O2 -Wall -Wextra -Isrc -Ivendor/libxnes/src \
            src/rom_compat.c tests/test_rom_compat.c "${XNES_SOURCES[@]}" \
            -lm -o build/host/test_rom_compat
          build/host/test_rom_compat
          sh -n "documents/NES Emulator.sh"

      - name: Cross-compile and verify KindleHF executable
        run: bash ./build.sh

      - name: Assemble installation and source archives
        run: |
          printf 'libxnes=45cab8022732542d0a8c6eddd4fb26c393744afe\\nFBInk=bab62e96716ef978dab52048eb4d1c79a8eecfa7\\nKindleSDK=b4a6c99d718a7cf74935f36105c62491b4336a61\\n' > vendor/UPSTREAM_VERSIONS.txt
          tar --exclude-vcs --exclude='./build' --exclude='./dist' \
            -czf dist/Kindle-NES-Source.tar.gz .
          PKG="$PWD/dist/package"
          mkdir -p "$PKG/documents" "$PKG/nes/bin" "$PKG/nes/saves" "$PKG/THIRD_PARTY_LICENSES"
          install -m 0755 "documents/NES Emulator.sh" "$PKG/documents/NES Emulator.sh"
          install -m 0755 dist/nes "$PKG/nes/bin/nes"
          cp README-INSTALL.txt "$PKG/README-INSTALL.txt"
          cp COPYING LICENSE-NOTES.txt "$PKG/"
          cp THIRD_PARTY_LICENSES/libxnes-MIT.txt "$PKG/THIRD_PARTY_LICENSES/"
          cp nes/saves/README.txt "$PKG/nes/saves/README.txt"
          cp dist/Kindle-NES-Source.tar.gz "$PKG/Kindle-NES-Source.tar.gz"
          (cd "$PKG" && zip -qr ../Kindle-NES-Install.zip .)
          (cd dist && sha256sum Kindle-NES-Install.zip Kindle-NES-Source.tar.gz nes > SHA256SUMS)
          ls -lh dist/Kindle-NES-Install.zip dist/Kindle-NES-Source.tar.gz dist/nes

      - name: Upload Kindle installation ZIP and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: kindle-nes-install-${{ github.sha }}
          path: |
            dist/Kindle-NES-Install.zip
            dist/Kindle-NES-Source.tar.gz
            dist/SHA256SUMS
            dist/nes
            dist/nes.sha256
            dist/elf-header.txt
            dist/elf-attributes.txt
            dist/elf-program-headers.txt
            dist/elf-dynamic.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > dist/RELEASE-NOTES.md <<'EOF'
          ## Kindle NES v0.1.5 — prerelease

          Native ARM KindleHF NES emulator package with the Gambatte-K2-style GTK2 ROM picker with responsive in-game event loop for the jailbroken Kindle Basic 10th Generation (2019), targeting firmware 5.16.8.

          ### Downloads
          - **Kindle-NES-Install.zip** — copy the `documents/` and `nes/` directories to the Kindle USB storage root.
          - **Kindle-NES-Source.tar.gz** — complete source snapshot and pinned upstream dependency references.
          - **nes** — standalone stripped ARM executable.
          - **SHA256SUMS** — checksums for the install ZIP, source archive, and executable.
          - ELF reports — architecture, ABI attributes, program headers, and dynamic dependency inspection.

          ### Validation
          - GitHub-hosted Ubuntu 24.04 runner completed the host-side mapper-0 ROM/core/controller tests.
          - KindleHF cross-compilation and ELF checks completed successfully.
          - This is **not yet validated on physical Kindle hardware**. Framebuffer waveform behavior, touchscreen event discovery/permissions, orientation, and real-game performance remain device-test items.

          ### Interface and ROM selection
          - GTK2 main window: Open Game, Options, Fullscreen, and Quit.
          - Open Game launches the Gambatte-K2-style picker: Cancel and current path at the top, scrollable file list, parent-directory row, folders first, and touch-drag scrolling.
          - Only `.nes` files are listed. Start browsing at `/mnt/us`; ROMs can remain in any subfolder. Cancel returns to the main window.
          - The NES CPU/PPU and cartridge emulation remain libxnes; the Game Boy core is not included.
          - GTK2/GLib/GDK libraries are dynamically linked from Kindle firmware and are not bundled.

          ### Gameplay freeze fix
          - Gameplay now runs in short GLib timer callbacks inside the GTK main loop instead of a blocking emulation loop. This keeps GTK/X11 event dispatch alive after ROM selection and lets the Exit/Pause touch handling remain responsive.
          - Runtime logs include ROM selection, detected evdev touchscreen, and game-loop startup at `/mnt/us/nes/nes.log`.

          ### ROM compatibility
          - Normalize basic NES 2.0 headers with 8-bit linear PRG/CHR bank counts into the legacy iNES format expected by the bundled libxnes parser.
          - Synthesize writable 8 KB CHR memory for CHR-RAM cartridges because this libxnes MMC1 implementation routes CHR reads/writes through its CHR buffer.
          - Host CI verifies a synthetic NES 2.0 mapper-1 (MMC1), CHR-RAM cartridge through normalization, core initialization, CHR read/write, and a frame step.
          - NES 2.0 extended mapper IDs, submappers, and extended/exponent ROM sizes remain unsupported.

          ### ROM loading diagnostics
          - Log the selected path, file size, source header, normalized mapper and size, and core initialization result to `/mnt/us/nes/nes.log`.
          - Display a plain-text GTK error dialog without applying container-only GTK properties to its label.

          ### Current limitations
          - Audio is disabled.
          - Save states and battery-backed saves are not implemented.
          - Not all NES cartridge formats and mappers are supported.
          EOF
          ASSETS=(
            dist/Kindle-NES-Install.zip
            dist/Kindle-NES-Source.tar.gz
            dist/SHA256SUMS
            dist/nes
            dist/nes.sha256
            dist/elf-header.txt
            dist/elf-attributes.txt
            dist/elf-program-headers.txt
            dist/elf-dynamic.txt
          )
          if gh release view v0.1.4 >/dev/null 2>&1; then
            gh release upload v0.1.4 "${ASSETS[@]}" --clobber
          else
            gh release create v0.1.4 "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Kindle NES v0.1.4" \
              --prerelease \
              --notes-file dist/RELEASE-NOTES.md
          fi
